syntax = "proto3";

package agrops.inference.v1;

// Contrato gRPC del inference-service (embeddings + generación).
// La implementación actual expone también HTTP JSON equivalente
// en /v1/embeddings y /v1/chat/completions para interoperar con OpenAI SDK.

service InferenceService {
  rpc Embed (EmbedRequest) returns (EmbedResponse);
  rpc Generate (GenerateRequest) returns (GenerateResponse);
}

message EmbedRequest {
  string model = 1;
  repeated string inputs = 2;
}

message EmbedResponse {
  string model = 1;
  repeated Embedding embeddings = 2;
}

message Embedding {
  repeated float values = 1;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message GenerateRequest {
  string model = 1;
  repeated ChatMessage messages = 2;
  float temperature = 3;
  int32 max_tokens = 4;
}

message GenerateResponse {
  string model = 1;
  string content = 2;
  int32 prompt_tokens = 3;
  int32 completion_tokens = 4;
}
