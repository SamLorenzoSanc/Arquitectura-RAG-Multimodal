name: Run Python tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install fast test requirements
        run: python -m pip install pytest pytest-asyncio pydantic httpx sqlalchemy

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/gateway
        run: |
          pytest -q gateway/tests/unit -m unit --confcutdir=gateway/tests/unit

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gateway
        working-directory: ./gateway
        run: python -m pip install -e .
      - name: Run integration tests without Ollama
        env:
          PYTHONPATH: ${{ github.workspace }}/gateway
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agrops_test
        run: pytest -q gateway/tests -m integration
