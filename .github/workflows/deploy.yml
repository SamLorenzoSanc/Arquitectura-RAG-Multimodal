name: Deploy to Azure

on:
  push:
    branches:
      - main

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  API_IMAGE: api-gateway
  FRONT_IMAGE: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build API
        run: |
          docker build \
            -t $REGISTRY/$API_IMAGE:${{ github.sha }} \
            ./api-gateway

      - name: Push API
        run: |
          docker push $REGISTRY/$API_IMAGE:${{ github.sha }}

      - name: Build Frontend
        run: |
          docker build \
            -t $REGISTRY/$FRONT_IMAGE:${{ github.sha }} \
            ./frontend

      - name: Push Frontend
        run: |
          docker push $REGISTRY/$FRONT_IMAGE:${{ github.sha }}

      - name: Deploy API
        run: |
          az containerapp update \
            --name api-gateway \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image $REGISTRY/$API_IMAGE:${{ github.sha }}

      - name: Deploy Frontend
        run: |
          az containerapp update \
            --name frontend \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image $REGISTRY/$FRONT_IMAGE:${{ github.sha }}