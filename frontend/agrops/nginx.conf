# default.conf (o el nombre de tu archivo de configuración)

server {
    listen 8000;

    # El resolver de DNS interno de Docker (siempre es esta IP)
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    location / {
        # Apunta al nombre del servicio de tu backend en docker-compose.yml
        # Si el servicio se llama 'api' y expone el puerto 8000:
        set $backend http://api-gateway:8000; 

        # Usa la variable en proxy_pass para forzar la resolución en caliente
        proxy_pass $backend;
        
        # Cabeceras estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}