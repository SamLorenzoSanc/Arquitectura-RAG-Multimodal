services:
  ollama:
    image: ollama/ollama:latest
    container_name: agrops-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: agrops-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      ollama pull ${RAG_EMBEDDING_MODEL:-qwen3-embedding:latest} &&
      ollama pull ${RAG_GENERATION_MODEL:-llama3.2:latest}

  postgres:
    image: pgvector/pgvector:pg18
    container_name: agrops-postgres
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init/00_create_dump_role.sql:/docker-entrypoint-initdb.d/00_create_dump_role.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/10_seed.sql:ro
      - ./postgres/migrations/001_hnsw_embeddings.sql:/docker-entrypoint-initdb.d/20_hnsw.sql:ro
      - ./postgres/migrations/002_evaluation_dataset_metadata.sql:/docker-entrypoint-initdb.d/30_evaluation.sql:ro
      - ./postgres/migrations/003_revoked_tokens.sql:/docker-entrypoint-initdb.d/40_revoked_tokens.sql:ro
      - ./postgres/migrations/004_agrotech_memberships.sql:/docker-entrypoint-initdb.d/50_agrotech_memberships.sql:ro
      - ./postgres/migrations/005_farmer_parcels.sql:/docker-entrypoint-initdb.d/60_farmer_parcels.sql:ro
      - ./postgres/migrations/006_parcel_polygons.sql:/docker-entrypoint-initdb.d/70_parcel_polygons.sql:ro
      - ./postgres/migrations/007_sensor_readings.sql:/docker-entrypoint-initdb.d/80_sensor_readings.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: pgvector/pgvector:pg18
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - for file in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$$file"; done

  api:
    build:
      context: ./gateway
    image: agrops-api
    container_name: agrops-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Local Compose siempre usa el servicio postgres (evita .env apuntando a Render/cloud).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_URL: http://ollama:11434
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      RAG_MAX_TOKENS: ${RAG_MAX_TOKENS:-640}
      RAG_TEMPERATURE: ${RAG_TEMPERATURE:-0}
      RAG_CHUNK_CHAR_LIMIT: ${RAG_CHUNK_CHAR_LIMIT:-600}
      RAG_KEEP_ALIVE: ${RAG_KEEP_ALIVE:-30m}
      RAG_USE_RERANKER: ${RAG_USE_RERANKER:-false}
      RAG_USE_QUERY_REWRITE: ${RAG_USE_QUERY_REWRITE:-false}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:latest}
      RAG_GENERATION_MODEL: ${RAG_GENERATION_MODEL:-llama3.2:latest}
      RETRIEVAL_CACHE_TTL: ${RETRIEVAL_CACHE_TTL:-120}
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend/agrops
    image: agrops-frontend
    container_name: agrops-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  ollama_data:
