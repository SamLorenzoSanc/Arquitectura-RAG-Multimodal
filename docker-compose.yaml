services:

  ollama:
    image: ollama/ollama:latest
    container_name: agrops-ollama
    ports:
      - "11434:11434"
    volumes:
      - C:\Users\Usuario\.ollama\models:/root/.ollama/models
  api: 
    build:
      context: ./gateway 
    image: agrops-api
    container_name: agrops-api
    env_file:
      - .env
    depends_on:
      - ollama
    ports:
      - "8000:8000" 

  frontend:
    build:
      context: ./frontend/agrops
    image: agrops-frontend
    container_name: agrops-frontend
    depends_on:
      - api
    ports:
      - "80:80"