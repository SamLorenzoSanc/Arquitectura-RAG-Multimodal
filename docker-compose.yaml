services:
  postgres:
    build:
      context: ./postgres
    image: postgres_db
    container_name: agrops-postgres
    environment:
      POSTGRES_DB: agrops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agrops
    ports:
      - "5432:5432"

  api-gateway:
    build:
      context: ./gateway
    image: api-gateway
    container_name: agrops-api-gateway
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend/agrops
    image: agrops-frontend
    container_name: agrops-frontend
    depends_on:
      - api-gateway
    ports:
      - "80:80"